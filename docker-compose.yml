# 密钥与口令都从环境变量 / 根目录 .env 读取（参考 .env.example），不再写死在这里。
# 基础设施端口只绑定到 127.0.0.1：本机调试可以连，局域网访问不到。
#
# 独立环境：name 固定为 video，容器 / 网络 / 数据卷都带 video 前缀（video_default、video_mysql_data ...），
# 不会和其它项目混在一起。在 E:\video 下执行：
#   docker compose up -d --build     启动
#   docker compose stop              停止（保留数据）
#   docker compose down              删除容器和网络（保留数据卷）
#   docker compose down -v           连数据卷一起删（清空数据库 / MinIO）
#
# restart 全部为 "no"：打开 Docker Desktop 时不会自动拉起这些容器，需要手动 up。
# 宿主机端口可在 .env 里改（MySQL 默认映射到 3307：Windows 上 3306 常被占用或保留）。
name: video

services:
  mysql:
    image: mysql:8.0
    container_name: video-mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: video_diagnosis
      MYSQL_USER: ${MYSQL_USER:-video}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-video}
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: video-redis
    restart: "no"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    # 官方 minio/minio 已于 2026-09-11 从 Docker Hub 删除，quay.io 也不再允许匿名拉取。
    # pgsty/silo 是社区维护的 MinIO 分支：同样的 S3 API、同样的 server 参数和 MINIO_ROOT_* 变量，
    # 以 root 运行，命名卷无需 chown。固定版本号，避免 latest 漂移。
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: video-minio
    restart: "no"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: video-app
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/video_diagnosis?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      APP_STORAGE_ENDPOINT: http://minio:9000
      APP_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_STORAGE_BUCKET: video-assets
      APP_STORAGE_PUBLIC_BASE_URL: http://localhost:${MINIO_PORT:-9000}
      # Java <-> Python 双向内部调用共用同一个密钥（X-Internal-Api-Key）
      APP_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      APP_AGENT_SERVICE_BASE_URL: http://agent-service:8090
      APP_DIAGNOSIS_RUNNING_TIMEOUT_MINUTES: 30
      APP_MEDIA_FFMPEG_PATH: ffmpeg
      APP_MEDIA_FFPROBE_PATH: ffprobe
      APP_MEDIA_TESSERACT_PATH: tesseract
      APP_MEDIA_TESSERACT_LANGUAGES: chi_sim+eng
      APP_MEDIA_OCR_ENABLED: true
      # 分析窗口与抽帧（v0.2）：前 120 秒，开场每秒一帧，之后每 3 秒一帧 + 镜头切换帧，最多 60 帧
      APP_MEDIA_ANALYSIS_WINDOW_SECONDS: ${ANALYSIS_WINDOW_SECONDS:-120}
      APP_MEDIA_FRAME_INTERVAL_SECONDS: ${FRAME_INTERVAL_SECONDS:-3}
      APP_MEDIA_MAX_KEYFRAMES: ${MAX_KEYFRAMES:-60}
      APP_MEDIA_OCR_PARALLELISM: ${OCR_PARALLELISM:-4}
      # 语音转写（OpenAI /audio/transcriptions）。Key 依次取 ASR_API_KEY、OPENAI_API_KEY、CHAT_API_KEY；
      # CHAT_API_KEY 是 DeepSeek 的 key 时请单独设置 ASR_API_KEY（DeepSeek 没有转写接口）。为空则跳过转写。
      APP_ASR_API_KEY: ${ASR_API_KEY:-${OPENAI_API_KEY:-${CHAT_API_KEY:-}}}
      APP_ASR_BASE_URL: ${ASR_BASE_URL:-https://api.openai.com/v1}
      APP_ASR_MODEL: ${ASR_MODEL:-whisper-1}
      APP_ASR_LANGUAGE: ${ASR_LANGUAGE:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: video-agent-service
    restart: "no"
    depends_on:
      app:
        condition: service_started
    environment:
      JAVA_BACKEND_BASE_URL: http://app:8080
      JAVA_INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      # Java -> agent-service 入站鉴权：Java 的 AgentServiceHttpClient 会带 X-Internal-Api-Key，
      # 两端共用 INTERNAL_API_KEY
      AGENT_SERVICE_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # 只在演示时设为 1；生产缺 Key 会直接让任务失败，不会把 mock 结论落库
      LLM_MOCK: ${LLM_MOCK:-0}
      LLM_TIMEOUT_SECONDS: 60
      SKILLS_DIR: /app/skills
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-4}
      HARNESS_MAX_TURNS: 20
      HARNESS_MAX_TOKENS: ${HARNESS_MAX_TOKENS:-200000}
      # 诊断质量规则：v2=区分差距/优势、强制原文引用、跨维度矛盾检查；v1=改造前行为（仅用于对比）
      QUALITY_RULES: ${QUALITY_RULES:-v2}
      # 评分点检索（RAG）：always=每个维度诊断前检索知识库评分点并要求结论注明依据；off=关闭（仅用于对比）
      RAG_MODE: ${RAG_MODE:-always}
      RUBRIC_TOP_K: ${RUBRIC_TOP_K:-6}
      RUBRIC_DIR: /app/knowledge/rubric
      HARNESS_MAX_GRAPH_STEPS: 25
      HARNESS_TIMEOUT_SECONDS: 300
      MAX_REACT_ITERATIONS: 3
      JAVA_HTTP_MAX_RETRIES: 3
      JAVA_HTTP_RETRY_BACKOFF_SECONDS: 0.5
      AGENT_SERVICE_HOST: 0.0.0.0
      AGENT_SERVICE_PORT: 8090
      AGENT_JSON_LOGS: "1"
    ports:
      - "127.0.0.1:${AGENT_PORT:-8090}:8090"
    volumes:
      # 内置评分点 md：在本地改 agent-service/knowledge/rubric/*.md，然后 docker compose restart agent-service
      - ./agent-service/knowledge:/app/knowledge:ro

volumes:
  mysql_data:
  redis_data:
  minio_data:
